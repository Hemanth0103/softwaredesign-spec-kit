[project]
name = "pnw-student-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for the PNW Student Information Chatbot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unused_configs = true
