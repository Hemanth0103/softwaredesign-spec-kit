# Docker Compose is the instruction sheet for running the three parts together.
# Run commands from this folder. Read docs/docker.md before your first start.
name: pnw-chatbot

services:
  db:
    # Version + digest = the exact PostgreSQL/pgvector image, not a moving 'latest'.
    image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_DB: pnw
      POSTGRES_USER: pnw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # The named volume keeps database files even when the container is replaced.
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    # No 'ports' entry: your computer/the internet cannot connect directly to DB.
    healthcheck:
      # TCP avoids passing against PostgreSQL's temporary initialization server.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    # Only this service receives the AI/OIDC/database application settings.
    # This injects secrets at RUN time; they are never copied into an image.
    env_file: ${APP_ENV_FILE:-.env}
    networks: [application, database]
    depends_on:
      db:
        # 'Started' isn't the same as 'ready'. Wait until the DB probe passes.
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # No published API port: the browser reaches it through the web service.

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    environment:
      SITE_ADDRESS: ':8080'
    # Left side is your computer; right side is the container. Loopback binding
    # makes the starter website accessible only from this computer.
    ports: ["127.0.0.1:8080:8080"]
    networks: [application]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Caddy keeps certificates here when the HTTPS deployment override is used.
      - caddy_data:/data
      - caddy_config:/config

  migrate:
    # A profile keeps this one-off job out of ordinary 'up'. It is NOT a fourth
    # long-running service. Explicit 'compose run migrate' selects it when needed.
    profiles: [tools]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: ${APP_ENV_FILE:-.env}
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    command: [sh, /usr/local/bin/migrate]
    restart: 'no'

networks:
  application: {}
  database:
    # Only attached containers can use this private network; DB has no internet.
    internal: true

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
